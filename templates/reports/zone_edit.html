{% extends "base.html" %}
{% block title %}Editar macro-zona{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h5 mb-3">Editar macro-zona</h1>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ zone.name }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Color</label>
                        <input type="color"
                               name="color"
                               class="form-control form-control-color"
                               value="{{ zone.color|default:'#1e88e5' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">GeoJSON (opcional)</label>
                        <textarea name="geojson"
                                  class="form-control"
                                  rows="10">{{ geojson_text }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'reports:zones_admin' %}" class="btn btn-secondary">Volver</a>
                        <button type="submit" class="btn btn-success">Guardar cambios</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
